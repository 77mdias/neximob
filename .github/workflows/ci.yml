# Verificações automáticas do Neximob (Arquitetura, seção 8).
# Rodam em cada pull request e em cada push na main.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  banco:
    name: Banco (migrações e testes pgTAP)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.1

      # Sobe só o Postgres do Supabase local e aplica as migrações.
      - name: Subir o banco do Supabase
        run: supabase db start

      - name: Rodar os testes do banco
        run: supabase test db

  edge-functions:
    name: Edge Functions (tipos e testes Deno)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Checar os tipos
        run: deno check supabase/functions/*/index.ts supabase/functions/_shared/*.ts

      - name: Rodar os testes
        run: deno test supabase/functions/_shared

  app:
    name: App Web (lint, tipos, testes e build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Checar lint
        run: pnpm lint

      - name: Checar tipos
        run: pnpm typecheck

      - name: Rodar testes unitários
        run: pnpm test

      - name: Gerar build (vinext)
        run: pnpm build
